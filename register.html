<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2T89W78LJ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2T89W78LJ3');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SAZUG Past Questions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2563eb', secondary: '#7e22ce' },
          animation: { 'slide-down': 'slideDown 0.5s ease-out', 'float': 'float 6s ease-in-out infinite' },
          keyframes: { 
            slideDown: { '0%': { transform: 'translateY(-10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          }
        }
      }
    }
  </script>
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .form-container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); padding: 2.5rem; width: 100%; max-width: 440px; position: relative; overflow: hidden; }
    .form-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #2563eb 0%, #7e22ce 100%); }
    .logo-badge { width: 88px; height: 88px; border-radius: 50%; background: white; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); animation: float 6s ease-in-out infinite; }
    .logo-badge img { width: 70%; height: 70%; object-fit: contain; }
    .input-field { width: 100%; padding: 0.85rem; padding-right: 2.5rem; border-radius: 0.75rem; border: 1px solid #e5e7eb; background-color: #f9fafb; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #2563eb; background-color: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .submit-btn { width: 100%; padding: 1rem; border-radius: 0.75rem; background: linear-gradient(135deg, #2563eb 0%, #7e22ce 100%); color: white; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
    .error-message { margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; background: #fee2e2; color: #ef4444; text-align: center; font-size: 0.875rem; display: none; }
    .password-wrapper { position: relative; }
    .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: #9ca3af; }
    
    .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 1.5rem; z-index: 10; backdrop-filter: blur(4px); }
    .spinner { width: 3rem; height: 3rem; border: 3px solid #e5e7eb; border-top: 3px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Checkbox Styling */
    .checkbox-custom { width: 1.15rem; height: 1.15rem; border: 2px solid #d1d5db; border-radius: 0.375rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .checkbox-custom.checked { background-color: #2563eb; border-color: #2563eb; }
    .checkbox-custom i { color: white; font-size: 0.7rem; display: none; }
    .checkbox-custom.checked i { display: block; }
  </style>
</head>
<body>
  <div class="form-container animate-slide-down">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p class="text-lg font-medium text-gray-700">Creating your account...</p>
    </div>

    <div class="logo-badge"><img src="badge.jpg" alt="Logo"></div>
    <h1 class="text-3xl font-bold text-gray-800 text-center">Create Account</h1>
    <p class="text-gray-500 text-center mb-6">Join thousands of students accessing past questions</p>

    <form id="registerForm" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name" class="input-field" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email Address</label>
        <input type="email" id="email" placeholder="Enter email address" class="input-field" required>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Matric Number</label>
        <input type="text" id="matric" name="username" autocomplete="username" placeholder="cscu/24/6186" class="input-field" required style="text-transform: lowercase;">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="new-password" autocomplete="new-password" placeholder="Create password" class="input-field" required>
          <i class="fa-regular fa-eye toggle-password" onclick="togglePass('password', this)"></i>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm password" class="input-field" required>
          <i class="fa-regular fa-eye toggle-password" onclick="togglePass('confirmPassword', this)"></i>
        </div>
      </div>

      <div class="flex items-start gap-3 py-2">
        <div id="termsCheckbox" class="checkbox-custom mt-0.5" onclick="toggleTerms()">
          <i class="fas fa-check"></i>
        </div>
        <input type="checkbox" id="termsInput" class="hidden" required>
        <label class="text-xs text-gray-600 leading-tight">
          I agree to the <a href="terms.html" class="text-blue-600 font-semibold hover:underline">Terms of Service</a> and <a href="privacy.html" class="text-blue-600 font-semibold hover:underline">Privacy Policy</a>.
        </label>
      </div>

      <div id="regError" class="error-message"></div>
      <button type="submit" class="submit-btn">Register Account</button>
    </form>

    <div class="bg-blue-50 border-l-4 border-blue-400 p-3 mt-4">
      <p class="text-[10px] text-blue-700 leading-tight">
        <strong>Note:</strong> This registration is local to your device only. Accounts are not saved on a server yet.
      </p>
    </div>

    <p class="text-center mt-4 text-sm text-gray-500">Already have an account? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Login</a></p>
  </div>

  <script>
    function togglePass(id, icon) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      icon.classList.toggle("fa-eye");
      icon.classList.toggle("fa-eye-slash");
    }

    function toggleTerms() {
      const input = document.getElementById("termsInput");
      const box = document.getElementById("termsCheckbox");
      input.checked = !input.checked;
      box.classList.toggle("checked", input.checked);
    }

    function parseMatric(matric) {
      const parts = matric.toLowerCase().split('/');
      let dept, yearStr;
      if (parts.length === 3) { dept = parts[0]; yearStr = parts[1]; } 
      else if (parts.length === 4) { dept = parts[1]; yearStr = parts[2]; } 
      else { return null; }
      const yearCode = parseInt(yearStr);
      if (isNaN(yearCode)) return null;
      let level = (2026 - (2000 + yearCode)) * 100;
      return { dept, level: level < 100 ? 100 : level };
    }

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const pass = document.getElementById("password").value;
      const confirmPass = document.getElementById("confirmPassword").value;
      const termsAccepted = document.getElementById("termsInput").checked;
      const errorDiv = document.getElementById("regError");
      
      if (!termsAccepted) {
        errorDiv.textContent = "You must agree to the terms!";
        errorDiv.style.display = "block";
        return;
      }

      if (pass !== confirmPass) {
        errorDiv.textContent = "Passwords do not match!";
        errorDiv.style.display = "block";
        return;
      }

      const matricVal = document.getElementById("matric").value.trim().toLowerCase();
      const data = parseMatric(matricVal);
      if(!data) {
        errorDiv.textContent = "Invalid Matric Format!";
        errorDiv.style.display = "block";
        return;
      }

      document.getElementById("loadingOverlay").style.display = 'flex';
      await new Promise(resolve => setTimeout(resolve, 2000));

      const user = {
        name: document.getElementById("fullName").value,
        email: document.getElementById("email").value,
        matric: matricVal,
        password: pass,
        dept: data.dept,
        level: data.level
      };

      localStorage.setItem("basugUser", JSON.stringify(user));
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
