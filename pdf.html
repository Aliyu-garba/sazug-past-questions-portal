<!-- pdf.html (Materials Display Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Course Materials | SAZUG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-secondary: #475569;
            --accent: #4f46e5;
            --accent-light: #eef2ff;
            --radius: 20px;
            --shadow: 0 4px 24px rgba(0,0,0,0.04);
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(8px);
            background: rgba(255,255,255,0.9);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition);
        }

        .back-btn:hover {
            background: #e0e7ff;
            transform: translateX(-2px);
        }

        .filter-info {
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
            background: #f1f5f9;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .page-header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .page-header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .page-header .badge {
            display: inline-block;
            margin-top: 0.5rem;
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .materials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .material-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.6rem;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: var(--shadow);
        }

        .material-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.06);
            border-color: #cbd5e1;
        }

        .material-icon {
            font-size: 2rem;
            color: var(--accent);
            background: #f1f5f9;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
        }

        .material-title {
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        .material-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .material-meta span {
            background: #f1f5f9;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
        }

        .btn-view {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            background: var(--accent);
            color: white;
            padding: 0.65rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background var(--transition);
            width: fit-content;
        }

        .btn-view:hover {
            background: #4338ca;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .footer-note {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            font-size: 0.8rem;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        @media (max-width: 640px) {
            .top-bar { padding: 1rem; }
            .page-header h1 { font-size: 1.6rem; }
            .materials-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Selection</a>
        <div class="filter-info" id="filterDisplay">Loading...</div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Your Course Materials</h1>
            <div class="badge" id="selectedInfo">Department / Level / Semester</div>
        </div>

        <div id="materialsContainer" class="materials-grid">
            <!-- dynamically populated -->
        </div>
    </div>

    <div class="footer-note">
        <i class="far fa-copyright"></i> SAZUG Materials Hub · For educational use only
    </div>

    <script>
        (function() {
            // Demo materials data (works offline, no server needed)
            const demoMaterials = [
                { id:1, dept:'csc', level:'200-level', semester:'first', title:'Introduction to Programming (CSC201)', type:'Lecture Notes', pdf:'#' },
                { id:2, dept:'csc', level:'200-level', semester:'first', title:'Data Structures Fundamentals', type:'Handout', pdf:'#' },
                { id:3, dept:'csc', level:'300-level', semester:'second', title:'Operating Systems Concepts', type:'PDF', pdf:'#' },
                { id:4, dept:'math', level:'100-level', semester:'first', title:'Calculus I - Limits & Derivatives', type:'Lecture Notes', pdf:'#' },
                { id:5, dept:'math', level:'200-level', semester:'second', title:'Linear Algebra Summary', type:'Summary', pdf:'#' },
                { id:6, dept:'eng', level:'100-level', semester:'first', title:'English Communication Skills', type:'Handout', pdf:'#' },
                { id:7, dept:'law', level:'400-level', semester:'first', title:'Constitutional Law Overview', type:'PDF', pdf:'#' },
                { id:8, dept:'pharm', level:'500-level', semester:'second', title:'Pharmacology Advanced Topics', type:'Lecture Notes', pdf:'#' },
                { id:9, dept:'nurs', level:'300-level', semester:'first', title:'Nursing Ethics & Practice', type:'PDF', pdf:'#' },
                { id:10, dept:'accounting', level:'200-level', semester:'second', title:'Financial Accounting II', type:'Handout', pdf:'#' },
                { id:11, dept:'csc', level:'400-level', semester:'first', title:'Machine Learning Basics', type:'Research Paper', pdf:'#' },
                { id:12, dept:'bio', level:'100-level', semester:'second', title:'Cell Biology Essentials', type:'Lecture Notes', pdf:'#' }
            ];

            // Try to fetch pdf.json (if exists), else use demo data
            async function fetchMaterials() {
                try {
                    const response = await fetch('pdf.json');
                    if (response.ok) {
                        const data = await response.json();
                        return data.materials || data;
                    }
                } catch (e) {
                    console.log('Using built-in demo materials (pdf.json not found)');
                }
                return demoMaterials;
            }

            function getQueryParam(param) {
                const params = new URLSearchParams(window.location.search);
                return params.get(param) || '';
            }

            function formatLabel(str) {
                return str.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            }

            async function renderPage() {
                const dept = getQueryParam('dept');
                const level = getQueryParam('level');
                const semester = getQueryParam('semester');

                // Update filter display
                document.getElementById('filterDisplay').textContent =
                    `📄 ${dept ? formatLabel(dept) : 'All'} · ${level ? formatLabel(level) : 'All'} · ${semester ? (semester === 'first' ? 'First Sem' : 'Second Sem') : 'All'}`;

                document.getElementById('selectedInfo').textContent =
                    `${dept ? formatLabel(dept) : 'Department'} / ${level ? formatLabel(level) : 'Level'} / ${semester ? (semester === 'first' ? 'First' : 'Second') : 'Semester'} Semester`;

                const allMaterials = await fetchMaterials();
                const filtered = allMaterials.filter(item => {
                    return (!dept || item.dept === dept) &&
                           (!level || item.level === level) &&
                           (!semester || item.semester === semester);
                });

                const container = document.getElementById('materialsContainer');
                container.innerHTML = '';

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-folder-open"></i>
                            <h3>No materials found</h3>
                            <p>Try adjusting your selection or check back later.</p>
                        </div>`;
                    return;
                }

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'material-card';
                    card.innerHTML = `
                        <div class="material-icon"><i class="fas fa-file-pdf"></i></div>
                        <div class="material-title">${item.title}</div>
                        <div class="material-meta">
                            <span><i class="far fa-folder"></i> ${formatLabel(item.dept)}</span>
                            <span><i class="fas fa-layer-group"></i> ${formatLabel(item.level)}</span>
                            <span><i class="far fa-calendar-alt"></i> ${item.semester === 'first' ? '1st Sem' : '2nd Sem'}</span>
                        </div>
                        <a href="${item.pdf}" class="btn-view" target="_blank"><i class="fas fa-download"></i> View PDF</a>
                    `;
                    container.appendChild(card);
                });
            }

            window.addEventListener('DOMContentLoaded', renderPage);
        })();
    </script>
</body>
</html>
