<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2T89W78LJ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2T89W78LJ3');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SAZUG Past Questions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#2563eb', secondary: '#7e22ce' },
          animation: { 'slide-down': 'slideDown 0.5s ease-out', 'float': 'float 6s ease-in-out infinite' },
          keyframes: { 
            slideDown: { '0%': { transform: 'translateY(-10px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
          }
        }
      }
    }
  </script>
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .form-container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); padding: 2.5rem; width: 100%; max-width: 440px; position: relative; overflow: hidden; }
    .form-container::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #2563eb 0%, #7e22ce 100%); }
    .logo-badge { width: 88px; height: 88px; border-radius: 50%; background: white; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); animation: float 6s ease-in-out infinite; }
    .logo-badge img { width: 70%; height: 70%; object-fit: contain; }
    .input-field { width: 100%; padding: 1rem; border-radius: 0.75rem; border: 1px solid #e5e7eb; background-color: #f9fafb; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #2563eb; background-color: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .submit-btn { width: 100%; padding: 1rem; border-radius: 0.75rem; background: linear-gradient(135deg, #2563eb 0%, #7e22ce 100%); color: white; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4); }
    .error-message { margin-top: 1rem; padding: 0.75rem; border-radius: 0.5rem; background: #fee2e2; color: #ef4444; text-align: center; font-size: 0.875rem; display: none; }
    .loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 1.5rem; z-index: 10; backdrop-filter: blur(4px); }
    .spinner { width: 3rem; height: 3rem; border: 3px solid #e5e7eb; border-top: 3px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .checkbox { width: 1.25rem; height: 1.25rem; border-radius: 0.375rem; border: 1px solid #d1d5db; margin-right: 0.75rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; }
    .checkbox.checked { background-color: #2563eb; border-color: #2563eb; }
    .checkbox i { display: none; color: white; font-size: 0.75rem; }
    .checkbox.checked i { display: block; }
  </style>
</head>
<body>
  <div class="form-container animate-slide-down">
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p class="text-lg font-medium text-gray-700">Logging you in...</p>
    </div>
    <div class="logo-badge"><img src="badge.jpg" alt="Logo"></div>
    <h1 class="text-3xl font-bold text-gray-800 text-center">Welcome Back</h1>
    <p class="text-gray-500 text-center mb-8">Sign in with your Email or Matric</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email or Matric Number</label>
        <input type="text" id="loginIdentifier" name="username" autocomplete="username" placeholder="Email or cscu/24/6186" class="input-field" required style="text-transform: lowercase;">
      </div>
      <div class="relative">
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPass" name="password" autocomplete="current-password" placeholder="••••••••" class="input-field pr-10" required>
        <i class="fa-regular fa-eye absolute right-3 top-[38px] cursor-pointer text-gray-400" onclick="togglePass('loginPass', this)"></i>
      </div>

      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center cursor-pointer group" onclick="toggleCheckbox()">
            <div id="rememberCheckbox" class="checkbox"><i class="fas fa-check"></i></div>
            <span class="text-sm text-gray-600 group-hover:text-blue-600">Remember me</span>
            <input type="checkbox" id="remember" class="hidden">
        </div>
        <a href="#" class="text-sm text-blue-600 font-semibold hover:underline">Forgot password?</a>
      </div>
      <div id="loginError" class="error-message">Invalid Credentials</div>
      <button type="submit" class="submit-btn mt-2">Login</button>
    </form>
    <p class="text-center mt-6 text-sm text-gray-500">Don't have an account? <a href="register.html" class="text-blue-600 font-semibold hover:underline">Register</a></p>
  </div>

  <script>
    function togglePass(id, icon) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      icon.classList.toggle("fa-eye");
      icon.classList.toggle("fa-eye-slash");
    }
    function toggleCheckbox() {
      const input = document.getElementById("remember");
      const box = document.getElementById("rememberCheckbox");
      input.checked = !input.checked;
      box.classList.toggle("checked", input.checked);
    }
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const identifier = document.getElementById("loginIdentifier").value.trim().toLowerCase();
      const pass = document.getElementById("loginPass").value;
      const errorDiv = document.getElementById("loginError");
      const storedData = localStorage.getItem("basugUser");
      if (!storedData) { errorDiv.textContent = "No account found."; errorDiv.style.display = "block"; return; }
      document.getElementById("loadingOverlay").style.display = 'flex';
      await new Promise(resolve => setTimeout(resolve, 1500));
      const user = JSON.parse(storedData);
      const isCorrectUser = (user.email.toLowerCase() === identifier || user.matric.toLowerCase() === identifier);
      if (isCorrectUser && user.password === pass) {
          if(document.getElementById("remember").checked) localStorage.setItem("basugRememberMe", "true");
          window.location.href = "home.html";
      } else {
          document.getElementById("loadingOverlay").style.display = 'none';
          errorDiv.style.display = "block";
      }
    });
  </script>
</body>
</html>
